name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release binary
        run: cargo build --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          Copy-Item "target/release/securevault.exe" -Destination "SecureVault-Windows-x64.exe"
          Compress-Archive -Path "SecureVault-Windows-x64.exe", "README.md" -DestinationPath "SecureVault-Windows-x64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Windows-x64
          path: |
            SecureVault-Windows-x64.exe
            SecureVault-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Apple Silicon (dmg & app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build macOS Apple Silicon (aarch64) binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/securevault target/release/securevault

      - name: Package macOS App & DMG
        run: |
          chmod +x package_mac.sh
          ./package_mac.sh target/release/securevault
          # 移除隔离属性，防止下载后 Gatekeeper 报"已损坏"
          xattr -cr SecureVault.app 2>/dev/null || true
          cp SecureVault.dmg SecureVault-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-macOS
          path: |
            SecureVault-macOS.dmg
            SecureVault.dmg
            SecureVault-macOS-portable.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'SecureVault Latest Build (最新自动构建)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            artifacts/SecureVault-Windows-x64.exe
            artifacts/SecureVault-Windows-x64.zip
            artifacts/SecureVault-macOS.dmg
            artifacts/SecureVault-macOS-portable.zip
          draft: false
          generate_release_notes: true
