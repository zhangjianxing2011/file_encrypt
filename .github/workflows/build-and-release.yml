name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release binary
        run: cargo build --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          Write-Host "Detected version: $version"
          $exeName = "SecureVault-Windows-$version-x64.exe"
          $zipName = "SecureVault-Windows-$version-x64.zip"
          Copy-Item "target/release/securevault.exe" -Destination $exeName
          Compress-Archive -Path $exeName, "README.md" -DestinationPath $zipName

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Windows
          path: |
            SecureVault-Windows-*.exe
            SecureVault-Windows-*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Apple Silicon (dmg & app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build macOS Apple Silicon (aarch64) binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/securevault target/release/securevault

      - name: Package macOS App & DMG (with ad-hoc signing)
        run: |
          chmod +x package_mac.sh
          ./package_mac.sh target/release/securevault
          # 验证签名
          codesign -vv SecureVault.app 2>&1 || true
          APP_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/' || echo "0.1.0")
          echo "Packaging macOS artifacts for version ${APP_VERSION}..."
          cp SecureVault.dmg "SecureVault-macOS-${APP_VERSION}.dmg"
          cp SecureVault-macOS-portable.zip "SecureVault-macOS-${APP_VERSION}-portable.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-macOS
          path: |
            SecureVault-macOS-*.dmg
            SecureVault-macOS-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SecureVault ${{ github.ref_name }}
          prerelease: false
          files: |
            artifacts/SecureVault-Windows-*.exe
            artifacts/SecureVault-Windows-*.zip
            artifacts/SecureVault-macOS-*.dmg
            artifacts/SecureVault-macOS-*.zip
          draft: false
          generate_release_notes: true
