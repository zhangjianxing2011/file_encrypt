[package]
name = "securevault"
version = "1.0.2"
edition = "2021"
description = "High-performance cross-platform folder encryption tool"
license = "MIT"

[[bin]]
name = "securevault"
path = "src/main.rs"

[dependencies]
# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# File system
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7"
indicatif = "0.17"

# Parallelism
rayon = "1"

# Error handling
anyhow = "1"
eframe = "0.37.0"
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"
